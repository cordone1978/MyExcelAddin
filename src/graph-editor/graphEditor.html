<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>关系画布</title>
  <script defer type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link href="graphEditor.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div class="shell">
    <header class="toolbar">
      <button id="loadTemplateLibraryBtn" class="btn">加载模板库</button>
      <button id="importFromSheetBtn" class="btn">从配置表生成模块</button>
      <button id="addNodeBtn" class="btn">新增模块</button>
      <button id="connectModeBtn" class="btn">连线模式：关</button>
      <button id="deleteSelectedBtn" class="btn">删除选中</button>
      <button id="clearAllBtn" class="btn danger">清空</button>
      <button id="saveBtn" class="btn">保存</button>
      <button id="writeToSheetBtn" class="btn primary">写入报价配置表</button>
    </header>

    <main class="main">
      <section class="canvas-panel">
        <div id="canvas" class="canvas">
          <svg id="edgeLayer" class="edge-layer"></svg>
          <div id="nodeLayer" class="node-layer"></div>
        </div>
      </section>

      <aside class="side-panel">
        <h2>模块属性</h2>
        <label>名称<input id="fieldLabel" type="text" /></label>
        <label>系统
          <select id="fieldSystem"></select>
        </label>
        <label>规格描述<input id="fieldDesc" type="text" /></label>
        <label>型号<input id="fieldType" type="text" /></label>
        <label>材质<input id="fieldMaterial" type="text" /></label>
        <label>品牌<input id="fieldBrand" type="text" /></label>
        <label>单位<input id="fieldUnit" type="text" /></label>
        <label>数量<input id="fieldQty" type="number" min="1" step="1" /></label>
        <label>单价<input id="fieldPrice" type="number" min="0" step="1" /></label>
        <button id="applyNodeBtn" class="btn primary">应用到当前选中模块</button>
        <hr />
        <h2>模板库（产品热点图）</h2>
        <div id="templateList" class="template-list"></div>
        <p id="statusText" class="status"></p>
      </aside>
    </main>
  </div>
</body>

</html>
