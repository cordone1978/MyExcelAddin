<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>信息参考</title>
  <script defer type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link href="infoReference.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div class="shell">
    <div class="left">
      <section class="panel">
        <div class="left-group">
          <h3>报价配置表设备</h3>
          <select id="deviceList" class="listbox" size="14"></select>
        </div>
        <div class="left-group">
          <h3>历史相关产品</h3>
          <select id="warehouseList" class="listbox" size="14"></select>
        </div>
      </section>
    </div>
    <div class="right">
      <section class="panel grow">
        <h3>报价配置表明细</h3>
        <div class="table-wrap">
          <table class="grid" id="quoteTable">
            <thead>
              <tr>
                <th>组件名称</th>
                <th>内容及规格</th>
                <th>型号</th>
                <th>主体材质</th>
                <th>品牌</th>
                <th>组件数量</th>
                <th>单位</th>
                <th>成本单价（元）</th>
                <th>成本合计（元）</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
      <section class="panel grow">
        <h3>历史数据库明细</h3>
        <div class="table-wrap">
          <table class="grid" id="dbDetailTable">
            <thead>
              <tr>
                <th>组件名称</th>
                <th>内容及规格</th>
                <th>型号</th>
                <th>主体材质</th>
                <th>品牌</th>
                <th>组件数量</th>
                <th>单位</th>
                <th>成本单价（元）</th>
                <th>成本合计（元）</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div id="dbMetaBox" class="meta-box"></div>
      </section>
    </div>
  </div>
</body>

</html>
